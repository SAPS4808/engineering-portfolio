function visual(p,cls=''){return '<div class="visual '+cls+(p.cover?' has-image':'')+'">'+(p.coverVideo?'<video muted playsinline '+(cls==='case-cover'?'controls':'loop autoplay')+' preload="metadata" aria-label="'+esc(p.title)+'" src="'+esc(safeUrl(p.coverVideo))+'"></video>':safeUrl(p.cover)?'<img src="'+esc(safeUrl(p.cover))+'" alt="'+esc(p.title)+'" loading="lazy">':diagram(p.kind||0))+'<span class="visual-tag mono">'+(p.cover||p.coverVideo?'':'Concept illustration / not project evidence')+'</span><span class="visual-bottom mono"><span>'+esc(p.category||'Engineering')+'</span></span></div>'}
function header(active=''){return '<div class="wrap"><header><a href="#/" class="brand">'+esc(content.initials||'YN')+'<span>Engineering & design</span></a><nav><a class="'+(active==='work'?'active':'')+'" href="#/">Work</a><a class="'+(active==='about'?'active':'')+'" href="#/about">About</a><a class="'+(active==='resume'?'active':'')+'" href="#/resume">Resume</a><a class="nav-contact" href="#/contact">Get in touch</a></nav></header></div>'}
function footer(){return '<footer><span>© '+new Date().getFullYear()+' '+esc(content.name)+'<br>Thoughtfully designed. Carefully engineered.</span></footer>'}
function contact(){return '<section class="contact" id="contact"><span class="eyebrow muted">Next conversation</span><h2>Let’s build<br>something useful.</h2><div class="contact-links">'+(content.email?'<a class="text-link" href="mailto:'+esc(content.email)+'">'+esc(content.email)+'</a>':'<span class="hint">Contact details coming soon.</span>')+(safeUrl(content.linkedin)?'<a class="text-link" target="_blank" rel="noopener" href="'+esc(safeUrl(content.linkedin))+'">LinkedIn</a>':'')+'<a class="text-link" href="#/resume">View resume</a></div></section>'}
let rotationTimer=null,rotationIndex=0,rotationPaused=false;
function projectSlides(){const seen=new Set();return content.projects.flatMap(p=>[...(p.id==='robotic-arm'?[]:[{url:p.cover,caption:p.title,id:p.id,type:'image/jpeg'}]),...(p.gallery||[]).filter(g=>p.id!=='robotic-arm'||g.type?.startsWith('video/')).map(g=>({...g,caption:g.caption||p.title,id:p.id}))]).filter(g=>g.url&&!g.url.includes('-poster.')&&!seen.has(g.url)&&seen.add(g.url));}
function slidePlayback(){document.querySelectorAll('.showcase-slide video').forEach(v=>{v.muted=true;if(v.closest('.showcase-slide').classList.contains('is-current')&&!rotationPaused){v.play().catch(()=>{})}else{v.pause()}})}
function showcase(){const slides=projectSlides();if(!slides.length)return '';return '<section class="project-showcase" aria-label="Project image showcase"><div class="showcase-stage">'+slides.map((g,i)=>'<a href="#/project/'+encodeURIComponent(g.id)+'" class="showcase-slide '+(i===0?'is-current':'')+'" aria-hidden="'+(i!==0)+'" tabindex="'+(i===0?'0':'-1')+'">'+(g.type?.startsWith('video/')?'<video muted playsinline loop preload="none" aria-label="'+esc(g.caption)+'" src="'+esc(safeUrl(g.url))+'"></video>':'<img src="'+esc(safeUrl(g.url))+'" alt="'+esc(g.caption)+'" '+(i===0?'fetchpriority="high"':'loading="lazy"')+'>')+'</a>').join('')+'</div><div class="showcase-caption"><span class="mono muted" id="showcase-label">'+esc(slides[0].caption)+'</span><div class="showcase-controls"><button type="button" id="rotation-toggle" onclick="toggleRotation()" aria-label="Pause image rotation">Pause</button></div></div></section>';}
function startRotation(){clearInterval(rotationTimer);rotationIndex=0;rotationPaused=matchMedia('(prefers-reduced-motion: reduce)').matches;const toggle=$('#rotation-toggle');if(toggle){toggle.textContent=rotationPaused?'Play':'Pause';toggle.setAttribute('aria-label',rotationPaused?'Play image rotation':'Pause image rotation');}if(!rotationPaused)rotationTimer=setInterval(advanceSlide,7000);slidePlayback();}
function advanceSlide(){if(document.hidden)return;const slides=projectSlides(),els=document.querySelectorAll('.showcase-slide');if(els.length<2)return;els[rotationIndex]?.classList.remove('is-current');els[rotationIndex]?.setAttribute('aria-hidden','true');els[rotationIndex]?.setAttribute('tabindex','-1');rotationIndex=(rotationIndex+1)%els.length;els[rotationIndex].classList.add('is-current');els[rotationIndex].setAttribute('aria-hidden','false');els[rotationIndex].setAttribute('tabindex','0');$('#showcase-label').textContent=slides[rotationIndex].caption;slidePlayback();}
function toggleRotation(){rotationPaused=!rotationPaused;clearInterval(rotationTimer);const b=$('#rotation-toggle');b.textContent=rotationPaused?'Play':'Pause';b.setAttribute('aria-label',rotationPaused?'Play image rotation':'Pause image rotation');if(!rotationPaused)rotationTimer=setInterval(advanceSlide,7000);slidePlayback();}
function timeline(){return '<div class="project-timeline">'+content.projects.map((p,i)=>'<article class="timeline-row"><span class="timeline-node" aria-hidden="true"></span><a class="timeline-image" href="#/project/'+encodeURIComponent(p.id)+'">'+visual(p)+'</a><div class="timeline-copy"><span class="mono muted">'+esc(p.category)+'</span><span class="project-status mono '+(p.status==='In progress'?'in-progress':'')+'">'+esc(p.status||'Completed')+'</span><h3><a href="#/project/'+encodeURIComponent(p.id)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.summary)+'</p><a class="text-link" href="#/project/'+encodeURIComponent(p.id)+'">Explore project</a></div></article>').join('')+'</div>';}
function cadViewer(p){if(!p.models?.length)return '';return '<section class="cad-section"><div class="section-heading"><div><span class="eyebrow muted">Design files</span><h2>Explore in 3D.</h2></div></div><div class="cad-toolbar"><label for="cad-model" class="mono">Model</label><select id="cad-model">'+p.models.map(m=>'<option value="'+esc(safeUrl(m.url))+'">'+esc(m.label)+'</option>').join('')+'</select><label class="cad-reference-label"><input type="checkbox" id="cad-reference" checked> Show reference geometry</label><button type="button" id="cad-reset">Reset view</button><a id="cad-download" href="'+esc(safeUrl(p.models[0].url.replace(/\.json$/,'.stl')))+'" download>Download STL</a></div><div id="cad-canvas" class="cad-canvas" role="img" aria-label="Interactive project CAD model"><p id="cad-status" role="status">Loading model…</p></div><p class="caption muted">Drag to rotate · Scroll or pinch to zoom · Right-drag to pan</p><p class="cad-disclosure">'+(p.modelNote?esc(p.modelNote):'Assembly reconstructed from supplied CAD and video. Surrounding hardware, dimensions and placement are approximate. <a href="./me360-assembly-notes.txt" target="_blank" rel="noopener">Model notes</a>')+'</p></section>';}
function workExperience(){return '<section class="work-experience"><span class="eyebrow muted">Work experience</span><div class="experience-list">'+(content.internships||[]).map(e=>'<article class="experience-item"><a class="company-logo" href="'+esc(safeUrl(e.url))+'" target="_blank" rel="noopener"><img src="'+esc(safeUrl(e.logo))+'" alt="'+esc(e.company)+' logo" loading="lazy"></a><div><a class="company-name" href="'+esc(safeUrl(e.url))+'" target="_blank" rel="noopener">'+esc(e.company)+'</a><h3>'+esc(e.role)+'</h3><p>'+esc(e.description)+'</p></div></article>').join('')+'</div></section>';}
function home(){return header('work')+'<main class="wrap fade"><section class="quiet-hero"><h1 class="hero-name">'+esc(content.name)+'</h1><h2>'+esc(content.intro)+'</h2><a href="#selected" class="text-link" onclick="event.preventDefault();document.getElementById(\'selected\').scrollIntoView({behavior:matchMedia(\'(prefers-reduced-motion: reduce)\').matches?\'instant\':\'smooth\'})">Explore the work</a></section>'+showcase()+workExperience()+'<section id="selected"><div class="section-heading"><div><span class="eyebrow muted">Selected work</span><h2>Thinking, made physical.</h2></div></div>'+timeline()+'</section><section class="about-band"><div><span class="eyebrow muted">The approach</span><h2>Engineering.<br>With perspective.</h2><img class="home-portrait" loading="lazy" src="'+esc(safeUrl(content.portrait))+'" alt="Shlok Agrawal"></div><div><p>'+esc(content.homeAbout)+'</p></div></section>'+contact()+footer()+'</main>'}
function project(id){const p=content.projects.find(p=>p.id===id);if(!p)return header()+'<main class="wrap"><h1 class="inner-title">Project not found.</h1><a href="#/">Back to work ↗</a></main>';return header('work')+'<main class="wrap fade"><a class="back" href="#/">← Selected work</a><p class="eyebrow muted" style="margin-top:45px">'+esc(p.category)+(p.sample?' / Sample case-study layout':'')+'</p><h1 class="inner-title">'+esc(p.title)+'</h1><p class="case-intro">'+esc(p.summary)+'</p><div class="case-meta" '+(!p.role&&!p.duration&&!p.tools?'style="display:none"':'')+'>'+[['Role',p.role],['Timeframe',p.duration],['Tools & methods',p.tools]].filter(x=>x[1]).map(x=>'<div><span class="eyebrow muted">'+x[0]+'</span><p>'+esc(x[1])+'</p></div>').join('')+'</div>'+visual(p,'case-cover')+cadViewer(p)+'<p class="caption muted" style="margin:12px 0 40px">'+(p.sample?'Illustrative layout. Replace with your actual project and evidence.':esc(p.category))+'</p>'+[['The challenge',p.problem],['Decisions & trade-offs',p.decisions],['Development',p.development],['Validation & outcomes',p.results]].filter(x=>x[1]).map(x=>'<section class="case-section"><h2>'+x[0]+'</h2><p>'+esc(x[1])+'</p></section>').join('')+(p.gallery?.length?'<div class="case-gallery">'+p.gallery.filter(g=>g.url!==p.coverVideo).map(g=>'<figure class="'+(g.type?.startsWith('video/')?'media-video '+(g.width>g.height?'landscape':'portrait'):'')+'">'+(g.type?.startsWith('video/')?'<video controls muted playsinline preload="metadata" width="'+esc(g.width||960)+'" height="'+esc(g.height||540)+'" src="'+esc(safeUrl(g.url))+'"></video>':'<img loading="lazy" src="'+esc(safeUrl(g.url))+'" alt="'+esc(g.caption||p.title)+'">')+'<figcaption>'+esc(g.caption)+'</figcaption></figure>').join('')+'</div>':'')+(p.technical?'<details><summary>Technical notes & documentation +</summary><p>'+esc(p.technical)+'</p></details>':'')+'<div style="margin:40px 0 70px"><a href="#/" class="text-link">All selected work <span>↗</span></a></div>'+footer()+'</main>'}
function aboutGallery(){return content.aboutPhotos?.length?'<section class="personal-gallery">'+content.aboutPhotos.map(g=>'<figure><img loading="lazy" src="'+esc(safeUrl(g.url))+'" alt="'+esc(g.caption||content.name)+'"><figcaption class="caption muted">'+esc(g.caption)+'</figcaption></figure>').join('')+'</section>':''}
function about(){return header('about')+'<main class="wrap fade"><p class="eyebrow muted" style="margin-top:55px">About / '+esc(content.name)+'</p><h1 class="inner-title">A curious mind.<br>A practical approach.</h1><div class="about-grid"><div class="portrait">'+(safeUrl(content.portrait)?'<img src="'+esc(safeUrl(content.portrait))+'" alt="'+esc(content.name)+'">':diagram(2))+'</div><div><p class="case-intro">'+esc(content.bio)+'</p><p style="white-space:pre-line">'+esc(content.about)+'</p>'+(content.location?'<p class="mono muted">Based in '+esc(content.location)+'</p>':'')+'<a href="#/resume" class="text-link">Experience & resume <span>↗</span></a></div></div>'+aboutGallery()+contact()+footer()+'</main>'}
function resume(){return header('resume')+'<main class="wrap fade"><p class="eyebrow muted" style="margin-top:55px">Experience & capabilities</p><h1 class="inner-title">'+esc(content.name)+'</h1><p class="case-intro">'+esc(content.discipline)+'</p><div class="resume-grid"><aside>'+(safeUrl(content.resume)?'<a class="text-link" href="'+esc(safeUrl(content.resume))+'" target="_blank" rel="noopener">Download resume PDF <span>↓</span></a>':'<div class="empty-note">Resume PDF coming soon.</div>')+'<p class="hint">'+esc(content.availability)+'</p></aside><div>'+[['Experience',content.experience],['Education',content.education],['Tools & capabilities',content.skills]].map(x=>'<section class="resume-section"><span class="eyebrow muted">'+x[0]+'</span><p>'+(x[1]?esc(x[1]):'Details to be added.')+'</p></section>').join('')+'</div></div>'+contact()+footer()+'</main>'}
function render(){clearInterval(rotationTimer);if(window.disposeCAD){window.disposeCAD();window.disposeCAD=null;}const route=location.hash.slice(1)||'/';document.title=content.name+' — Engineering & Design';$('#app').innerHTML=(route.startsWith('/project/')?project(decodeURIComponent(route.slice(9))):route==='/about'?about():route==='/resume'?resume():home());if(!route.startsWith('/project/')&&route!=='/about'&&route!=='/resume')startRotation();if(document.getElementById('cad-canvas'))import('./cad-viewer.js?v=drone-20261022').then(m=>{if(document.getElementById('cad-canvas'))m.mountCAD()}).catch(()=>{const s=document.getElementById('cad-status');if(s)s.textContent='3D preview unavailable. Download the STL to inspect the model.'});if(route==='/contact')setTimeout(()=>$('#contact')?.scrollIntoView(),30);}
function toast(message){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),5000)}
window.addEventListener('hashchange',()=>{render();if(location.hash!=='#/contact')window.scrollTo(0,0)});
fetch('./content.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{content=data;render()}).catch(()=>{$('#app').innerHTML='<p style="padding:5vw">Could not load your portfolio. Please refresh to try again.</p>'});
</script></body></html>
