function footer(){return '<footer><span>© '+new Date().getFullYear()+' '+esc(content.name)+'<br>Thoughtfully designed. Carefully engineered.</span><span><button class="editor-link" onclick="openEditor()">Edit portfolio ↗</button></span></footer>'}
function contact(){return '<section class="contact" id="contact"><span class="eyebrow muted">04 / Next conversation</span><h2>Let’s build<br>something useful.</h2><div class="contact-links">'+(content.email?'<a class="text-link" href="mailto:'+esc(content.email)+'">'+esc(content.email)+' <span>↗</span></a>':'<span class="hint">Contact details coming soon.</span>')+(safeUrl(content.linkedin)?'<a class="text-link" target="_blank" rel="noopener" href="'+esc(safeUrl(content.linkedin))+'">LinkedIn <span>↗</span></a>':'')+'<a class="text-link" href="#/resume">View resume <span>↗</span></a></div></section>'}
function home(){const ps=content.projects,p=ps[0];return header('work')+'<main class="wrap fade"><section><div class="hero-top"><span class="mono">'+esc(content.discipline)+'</span><span class="mono muted">'+esc(content.availability||'Selected work / portfolio')+'</span></div><h1 class="hero-name">'+esc(content.name)+'.</h1><div class="hero-grid"><div class="hero-copy"><h2>'+esc(content.intro)+'</h2><p>'+esc(content.bio)+'</p><a href="#selected" class="text-link" onclick="event.preventDefault();document.getElementById(\'selected\').scrollIntoView({behavior:matchMedia(\'(prefers-reduced-motion: reduce)\').matches?\'instant\':\'smooth\'})">Explore the work <span>↘</span></a><div class="hero-index mono">Objects. Systems. Evidence.<br>From question to working prototype.</div></div>'+visual({cover:content.hero,kind:0,category:'InsideFPV / drone design',year:'04'},'hero-visual')+'</div><div class="hero-foot"><span class="sample-note">'+(ps.some(p=>p.sample)?'Design preview — sample projects awaiting your work.':'A selection of projects, processes, and practical outcomes.')+'</span><span class="scroll mono">Scroll to explore ↓</span></div></section><section id="selected"><div class="section-heading"><div><span class="eyebrow muted">01 / Selected work</span><h2>Thinking, made physical.</h2></div><span class="mono">'+String(ps.length).padStart(2,'0')+' selected projects</span></div>'+(p?'<a class="featured" href="#/project/'+encodeURIComponent(p.id)+'">'+visual(p)+'<div class="project-info"><div class="project-num mono">01 / Featured project</div><span class="tag">'+esc(p.category)+(p.sample?' · Sample layout':'')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p><span class="text-link">Explore project <span>↗</span></span></div></a>':'<div class="empty-note">Projects coming soon.</div>')+'<div class="project-grid">'+ps.slice(1).map((p,i)=>'<a class="project-card" href="#/project/'+encodeURIComponent(p.id)+'">'+visual(p)+'<div class="card-line"><div><span class="tag">'+String(i+2).padStart(2,'0')+' / '+esc(p.category)+(p.sample?' · Sample':'')+'</span><h3>'+esc(p.title)+'</h3></div><span class="arrow">↗</span></div><p class="card-summary">'+esc(p.summary)+'</p></a>').join('')+'</div><div class="gallery-footer"><span class="mono muted">Design. Build. Test. Refine.</span><a href="#/resume" class="mono">View resume ↗</a></div></section><section class="about-band"><div><span class="eyebrow muted">02 / The approach</span><h2>Curiosity.<br>With a purpose.</h2><img class="home-portrait" loading="lazy" src="'+esc(safeUrl(content.portrait))+'" alt="Shlok Agrawal"></div><div><p>'+esc(content.about)+'</p><div class="principles mono"><span>01 / Question</span><span>02 / Make</span><span>03 / Learn</span></div><a href="#/about" class="text-link">More about me <span>↗</span></a></div></section>'+contact()+footer()+'</main>'}
function project(id){const p=content.projects.find(p=>p.id===id);if(!p)return header()+'<main class="wrap"><h1 class="inner-title">Project not found.</h1><a href="#/">Back to work ↗</a></main>';return header('work')+'<main class="wrap fade"><a class="back" href="#/">← Selected work</a><p class="eyebrow muted" style="margin-top:45px">'+esc(p.category)+(p.sample?' / Sample case-study layout':'')+'</p><h1 class="inner-title">'+esc(p.title)+'</h1><p class="case-intro">'+esc(p.summary)+'</p><div class="case-meta" '+(!p.role&&!p.duration&&!p.tools?'style="display:none"':'')+'>'+[['Role',p.role],['Timeframe',p.duration],['Tools & methods',p.tools]].filter(x=>x[1]).map(x=>'<div><span class="eyebrow muted">'+x[0]+'</span><p>'+esc(x[1])+'</p></div>').join('')+'</div>'+visual(p,'case-cover')+'<p class="caption muted" style="margin:12px 0 40px">'+(p.sample?'Illustrative layout. Replace with your actual project and evidence.':esc(p.category))+'</p>'+[['01 / The challenge',p.problem],['02 / Decisions & trade-offs',p.decisions],['03 / Development',p.development],['04 / Validation & outcomes',p.results]].filter(x=>x[1]).map(x=>'<section class="case-section"><h2>'+x[0]+'</h2><p>'+esc(x[1])+'</p></section>').join('')+(p.gallery?.length?'<div class="case-gallery">'+p.gallery.map(g=>'<figure>'+(g.type?.startsWith('video/')?'<video controls playsinline preload="metadata" poster="'+esc(safeUrl(g.poster||''))+'" src="'+esc(safeUrl(g.url))+'"></video>':'<img loading="lazy" src="'+esc(safeUrl(g.url))+'" alt="'+esc(g.caption||p.title)+'">')+'<figcaption>'+esc(g.caption)+'</figcaption></figure>').join('')+'</div>':'')+(p.technical?'<details><summary>Technical notes & documentation +</summary><p>'+esc(p.technical)+'</p></details>':'')+'<div style="margin:40px 0 70px"><a href="#/" class="text-link">All selected work <span>↗</span></a></div>'+footer()+'</main>'}
function aboutGallery(){return content.aboutPhotos?.length?'<section class="personal-gallery">'+content.aboutPhotos.map(g=>'<figure><img loading="lazy" src="'+esc(safeUrl(g.url))+'" alt="'+esc(g.caption||content.name)+'"><figcaption class="caption muted">'+esc(g.caption)+'</figcaption></figure>').join('')+'</section>':''}
function about(){return header('about')+'<main class="wrap fade"><p class="eyebrow muted" style="margin-top:55px">About / '+esc(content.name)+'</p><h1 class="inner-title">A curious mind.<br>A practical approach.</h1><div class="about-grid"><div class="portrait">'+(safeUrl(content.portrait)?'<img src="'+esc(safeUrl(content.portrait))+'" alt="'+esc(content.name)+'">':diagram(2))+'</div><div><p class="case-intro">'+esc(content.bio)+'</p><p style="white-space:pre-line">'+esc(content.about)+'</p>'+(content.location?'<p class="mono muted">Based in '+esc(content.location)+'</p>':'')+'<a href="#/resume" class="text-link">Experience & resume <span>↗</span></a></div></div>'+aboutGallery()+contact()+footer()+'</main>'}
function resume(){return header('resume')+'<main class="wrap fade"><p class="eyebrow muted" style="margin-top:55px">03 / Experience & capabilities</p><h1 class="inner-title">'+esc(content.name)+'</h1><p class="case-intro">'+esc(content.discipline)+'</p><div class="resume-grid"><aside>'+(safeUrl(content.resume)?'<a class="text-link" href="'+esc(safeUrl(content.resume))+'" target="_blank" rel="noopener">Download resume PDF <span>↓</span></a>':'<div class="empty-note">Resume PDF coming soon.</div>')+'<p class="hint">'+esc(content.availability)+'</p></aside><div>'+[['Experience',content.experience],['Education',content.education],['Tools & capabilities',content.skills]].map(x=>'<section class="resume-section"><span class="eyebrow muted">'+x[0]+'</span><p>'+(x[1]?esc(x[1]):'Details to be added.')+'</p></section>').join('')+'</div></div>'+contact()+footer()+'</main>'}
function render(){const route=location.hash.slice(1)||'/';document.title=content.name+' — Engineering & Design';$('#app').innerHTML=(content.name==='Your Name'?'<div class="top-banner"><span>Portfolio design preview · Add your name, projects, and images.</span><button onclick="openEditor()">Open editor ↗</button></div>':'')+(route.startsWith('/project/')?project(decodeURIComponent(route.slice(9))):route==='/about'?about():route==='/resume'?resume():home());if(route==='/studio')setTimeout(()=>openEditor(),30);if(route==='/contact')setTimeout(()=>$('#contact')?.scrollIntoView(),30);}
function toast(message){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),5000)}
function field(label,key,value,area=false,project=false){return '<label class="field"><span>'+esc(label)+'</span><'+(area?'textarea':'input')+' data-key="'+esc(key)+'" data-project="'+project+'" '+(area?'':'value="'+esc(value)+'"')+'>'+(area?esc(value)+'</textarea>':'')+'</label>'}
function upload(label,key,value,project=false,accept='image/jpeg,image/png,image/webp,image/gif'){return '<div class="field"><span>'+esc(label)+'</span><div class="upload-row"><input type="file" accept="'+accept+'" data-upload="'+key+'" data-project="'+project+'">'+(value?'<a class="hint" href="'+esc(safeUrl(value))+'" target="_blank" rel="noopener">View current file ↗</a><button class="btn" type="button" onclick="clearAsset(\''+key+'\','+project+')">Remove</button>':'')+'</div></div>'}
function markDirty(){dirty=true;const s=$('.save-state');if(s)s.textContent='Unsaved changes'}
function openEditor(){draft=structuredClone(content);try{const saved=JSON.parse(localStorage.getItem('portfolio-studio-draft'));if(saved&&saved.name&&Array.isArray(saved.projects)&&saved._baseRevision===content.revision)draft=saved}catch(e){}dirty=false;tab='profile';editingProject=null;document.body.style.overflow='hidden';drawEditor()}
function closeEditor(){if(dirty&&!confirm('Discard unsaved changes?'))return;$('#editor-root').innerHTML='';document.body.style.overflow='';draft=null;}
function editorPanel(){
 if(tab==='profile')return '<h2 class="editor-intro">Make it yours.</h2><p class="hint">These details appear across the homepage, About page, and navigation. Save previews on this device; download content.json and upload it to GitHub to publish.</p><div class="fields">'+field('Full name','name',draft.name)+field('Initials / wordmark','initials',draft.initials)+field('Engineering disciplines','discipline',draft.discipline)+field('Opening headline','intro',draft.intro)+field('Location (optional)','location',draft.location)+field('Availability (optional)','availability',draft.availability)+'</div>'+field('Short introduction','bio',draft.bio,true)+field('About / approach','about',draft.about,true)+upload('Homepage image','hero',draft.hero)+upload('Portrait / workshop photograph','portrait',draft.portrait);
 if(tab==='projects'&&editingProject){const p=draft.projects.find(x=>x.id===editingProject);return '<button class="btn" onclick="editingProject=null;drawEditor()">← Project list</button><h2 class="editor-intro" style="margin-top:25px">'+esc(p.title)+'</h2><label class="field"><span><input type="checkbox" id="sample-check" '+(p.sample?'checked':'')+'> Mark as sample content</span></label><div class="fields">'+field('Project title','title',p.title,false,true)+field('Discipline / category','category',p.category,false,true)+field('Figure number / year','year',p.year,false,true)+field('Your role','role',p.role,false,true)+field('Timeframe','duration',p.duration,false,true)+field('Tools & methods','tools',p.tools,false,true)+'</div>'+field('Short summary','summary',p.summary,true,true)+upload('Cover image','cover',p.cover,true)+[['The challenge','problem'],['Decisions & trade-offs','decisions'],['Development & iteration','development'],['Validation & outcomes','results'],['Technical appendix (optional)','technical']].map(x=>field(x[0],x[1],p[x[1]],true,true)).join('')+'<h3>Project gallery</h3><p class="hint">Upload images or short videos (up to 20 MB each). Add captions below.</p><input type="file" id="gallery-upload" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm">'+(p.gallery||[]).map((g,i)=>'<div class="editor-card"><div style="flex:1">'+(g.type?.startsWith('video/')?'<span class="hint">Video uploaded</span>':'<img class="upload-preview" src="'+esc(safeUrl(g.url))+'" alt="Gallery preview">')+'<label class="field"><span>Caption '+(i+1)+'</span><input data-caption="'+i+'" value="'+esc(g.caption)+'"></label></div><button class="btn" onclick="removeGallery('+i+')">Remove</button></div>').join('');}
 if(tab==='projects')return '<h2 class="editor-intro">Curate your work.</h2><p class="hint">The first project is featured. Use ↑ and ↓ to reorder. Sample projects are illustrative templates, not claims about your experience.</p><button class="btn primary" onclick="addProject()">+ Add project</button>'+draft.projects.map((p,i)=>'<div class="editor-card"><div><span class="tag">'+String(i+1).padStart(2,'0')+(p.sample?' / sample':'')+'</span><h3>'+esc(p.title)+'</h3><span class="hint">'+esc(p.category)+'</span></div><div class="editor-actions"><button class="btn" '+(i===0?'disabled':'')+' onclick="moveProject('+i+',-1)" aria-label="Move project up">↑</button><button class="btn" '+(i===draft.projects.length-1?'disabled':'')+' onclick="moveProject('+i+',1)" aria-label="Move project down">↓</button><button class="btn" onclick="editingProject=\''+esc(p.id)+'\';drawEditor()">Edit</button><button class="btn danger" onclick="deleteProject('+i+')">Delete</button></div></div>').join('');
 if(tab==='resume')return '<h2 class="editor-intro">Experience, clearly presented.</h2>'+upload('Resume PDF','resume',draft.resume,false,'application/pdf')+field('Experience (roles, organizations, dates, contributions)','experience',draft.experience,true)+field('Education (degree, institution, graduation year)','education',draft.education,true)+field('Tools & capabilities','skills',draft.skills,true);
 return '<h2 class="editor-intro">Start the conversation.</h2>'+field('Email','email',draft.email)+field('LinkedIn URL','linkedin',draft.linkedin)+'<p class="hint">This editor changes only your local preview. Click Download content.json, then upload that file to your GitHub repository to publish. No passwords or credentials are stored here.</p><h3>Publish your updates</h3><p class="hint">Download your edited content.json, then upload it to this repository to publish. Images added here are embedded in the file. Use the reset button to discard a saved local preview.</p><button class="btn" onclick="exportContent()">Download content.json ↓</button> <a class="btn" href="https://github.com/SAPS4808/engineering-portfolio/upload/main" target="_blank" rel="noopener">Upload to GitHub ↗</a> <button class="btn" onclick="resetLocal()">Reset local preview</button>';
}
function drawEditor(){const scroll=$('.editor')?.scrollTop||0;$('#editor-root').innerHTML='<section class="editor" role="dialog" aria-modal="true" aria-label="Portfolio editor"><div class="editor-head"><strong>Portfolio / Studio</strong><div class="editor-actions"><span class="save-state">'+(dirty?'Unsaved changes':'Preview saved')+'</span><button class="btn" onclick="closeEditor()">Close</button><button class="btn primary" id="save-button" onclick="saveContent()">Save preview ↗</button></div></div><div class="editor-body"><p class="eyebrow muted">Your content. Your portfolio.</p><div class="editor-tabs">'+['profile','projects','resume','contact'].map(t=>'<button class="btn '+(tab===t?'selected':'')+'" onclick="tab=\''+t+'\';editingProject=null;drawEditor()">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><p class="status" role="status" id="upload-status"></p>'+editorPanel()+'</div></section>';$('.editor').scrollTop=scroll;
 document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{const target=el.dataset.project==='true'?draft.projects.find(p=>p.id===editingProject):draft;target[el.dataset.key]=el.value;markDirty()}));
 document.querySelectorAll('[data-upload]').forEach(el=>el.addEventListener('change',async()=>{if(!el.files[0])return;try{const result=await sendFile(el.files[0]);const target=el.dataset.project==='true'?draft.projects.find(p=>p.id===editingProject):draft;target[el.dataset.upload]=result.url;markDirty();drawEditor();toast('File uploaded. Save changes to use it.')}catch(e){toast(e.message)}}));
 $('#sample-check')?.addEventListener('change',e=>{draft.projects.find(p=>p.id===editingProject).sample=e.target.checked;markDirty()});
 document.querySelectorAll('[data-caption]').forEach(el=>el.addEventListener('input',()=>{draft.projects.find(p=>p.id===editingProject).gallery[+el.dataset.caption].caption=el.value;markDirty()}));
 $('#gallery-upload')?.addEventListener('change',async e=>{const p=draft.projects.find(p=>p.id===editingProject);try{for(const f of e.target.files){const r=await sendFile(f);p.gallery.push({url:r.url,caption:'',type:f.type});markDirty()}drawEditor();toast('Gallery uploaded. Save changes to publish it.')}catch(err){drawEditor();toast(err.message)}});
}
function clearAsset(key,project){(project?draft.projects.find(p=>p.id===editingProject):draft)[key]='';markDirty();drawEditor()}
async function sendFile(file){if(file.size>8*1024*1024)throw new Error('Use a file smaller than 8 MB.');const allowed=['image/jpeg','image/png','image/webp','image/gif','application/pdf','video/mp4','video/webm'];if(!allowed.includes(file.type))throw new Error('Use JPG, PNG, WebP, GIF, PDF, MP4 or WebM.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({url:reader.result});reader.onerror=()=>reject(new Error('Could not read file'));reader.readAsDataURL(file)})}

function addProject(){const p=structuredClone(seedProject());draft.projects.push(p);editingProject=p.id;markDirty();drawEditor()}
function seedProject(){return {id:'project-'+crypto.randomUUID(),title:'New project',category:'Mechanical design',year:String(draft.projects.length+1).padStart(2,'0'),summary:'',cover:'',kind:0,role:'',duration:'',tools:'',problem:'',decisions:'',development:'',results:'',technical:'',gallery:[],sample:false}}
function moveProject(i,d){[draft.projects[i],draft.projects[i+d]]=[draft.projects[i+d],draft.projects[i]];markDirty();drawEditor()}
function deleteProject(i){if(!confirm('Remove this project from your portfolio?'))return;draft.projects.splice(i,1);markDirty();drawEditor()}
function removeGallery(i){draft.projects.find(p=>p.id===editingProject).gallery.splice(i,1);markDirty();drawEditor()}
async function saveContent(){if(!draft.name.trim()){toast('Please add your name.');return}draft.name=draft.name.trim();if(draft.linkedin&&!/^https?:\/\//i.test(draft.linkedin))draft.linkedin='https://'+draft.linkedin;content=structuredClone(draft);try{draft._baseRevision=content.revision;localStorage.setItem('portfolio-studio-draft',JSON.stringify(draft))}catch(e){toast('Device storage is full. Download content.json to keep this update.')}dirty=false;render();drawEditor();toast('Preview saved on this device. Download content.json to publish through GitHub.');}

function resetLocal(){localStorage.removeItem('portfolio-studio-draft');draft=structuredClone(content);dirty=false;drawEditor();toast('Local preview reset.')}
function exportContent(){const u=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='content.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});window.addEventListener('hashchange',()=>{render();if(location.hash!=='#/contact')window.scrollTo(0,0)});
fetch('./content.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{content=data;render()}).catch(()=>{$('#app').innerHTML='<p style="padding:5vw">Could not load your portfolio. Please refresh to try again.</p>'});
</script></body></html>
